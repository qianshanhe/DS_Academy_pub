name: Validate quiz questions

on:
  pull_request:
    paths:
      - "Quizzes/dashboard/app.js"
      - "Quizzes/validator/**"
      - ".github/workflows/validate-quizzes.yml"
  push:
    branches: [main]
    paths:
      - "Quizzes/dashboard/app.js"
      - "Quizzes/validator/**"
      - ".github/workflows/validate-quizzes.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node Quizzes/validator/validate-quiz-bank.test.mjs
      - run: node Quizzes/validator/validate-quiz-bank.mjs
